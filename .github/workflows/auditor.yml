name: Auditor Automático

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # Diario ~05:17 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auditor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Auditoría de solo lectura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para diffs y gitleaks con historial

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install openai pyyaml

      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Ejecutar auditor
        id: auditor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}   # opcional (proveedores compatibles)
          AUDITOR_MODEL: ${{ vars.AUDITOR_MODEL || 'gpt-4o' }}
          AUDITOR_MAX_TOKENS: ${{ vars.AUDITOR_MAX_TOKENS || '8000' }}
          AUDITOR_MAX_INPUT_CHARS: ${{ vars.AUDITOR_MAX_INPUT_CHARS || '120000' }}
          AUDITOR_PROVIDER: ${{ vars.AUDITOR_PROVIDER || 'openai' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python auditor/auditor.py

      - name: Guardar AUDITORIA.md (solo en push / schedule / manual)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Auditor Automático"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUDITORIA.md
          if git diff --cached --quiet; then
            echo "Sin cambios en AUDITORIA.md"
          else
            git commit -m "docs: actualizar auditoría automática"
            git push
          fi

      - name: Comentar resumen en el Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'auditor/pr_summary.md';
            let body = '## 🔍 Auditoría automática\n\nNo se generó resumen.';
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            }
            // Buscar comentario previo del bot para actualizarlo
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## 🔍 Auditoría automática';
            const prev = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body: body,
              });
              console.log('Comentario de auditoría actualizado');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log('Comentario de auditoría creado');
            }
