# Configuración del Auditor Automático
# Se puede sobrescribir con variables de entorno (ver README)

model: "gpt-4o"                    # Modelo OpenAI (o compatible)
max_tokens: 8000                   # Límite de salida del informe
max_input_chars: 120000            # Límite aproximado de caracteres enviados al LLM
provider: "openai"                 # openai | compatible (usa OPENAI_BASE_URL)

# Directorios ignorados
ignored_dirs:
  - ".git"
  - ".github"
  - "node_modules"
  - "vendor"
  - "dist"
  - "build"
  - ".next"
  - ".cache"
  - "__pycache__"
  - ".venv"
  - "venv"
  - "coverage"
  - ".turbo"
  - ".nuxt"

# Extensiones de texto a analizar
text_extensions:
  - ".html"
  - ".htm"
  - ".css"
  - ".scss"
  - ".js"
  - ".mjs"
  - ".cjs"
  - ".ts"
  - ".tsx"
  - ".jsx"
  - ".json"
  - ".md"
  - ".yml"
  - ".yaml"
  - ".toml"
  - ".ini"
  - ".env.example"
  - ".sql"
  - ".py"
  - ".php"
  - ".java"
  - ".kt"
  - ".go"
  - ".rs"
  - ".txt"
  - ".sh"
  - ".bash"
  - ".dockerfile"

# Archivos/patrones críticos (se priorizan y se envían completos)
critical_patterns:
  - "**/auth*"
  - "**/login*"
  - "**/supabase*"
  - "**/*rls*"
  - "**/*policy*"
  - "**/middleware*"
  - "**/security*"
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "requirements.txt"
  - "pyproject.toml"
  - "Cargo.toml"
  - "go.mod"
  - ".env.example"
  - "**/Dockerfile*"
  - "**/docker-compose*"
  - "**/*secret*"
  - "**/*credential*"
  - "**/config*"

# Límites de tamaño
max_file_bytes: 150000
max_total_bytes: 1800000
max_critical_file_bytes: 300000

# Historial
history_keep: 5                    # Cuántas auditorías anteriores conservar en el archivo

# Herramientas locales
enable_gitleaks: true
enable_local_heuristics: true
